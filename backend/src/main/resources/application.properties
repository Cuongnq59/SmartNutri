server.port=8080
spring.application.name=smartnutri-backend

# Active profile: 'mysql' to connect to local MySQL 8.0, or 'dev' for in-memory H2.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Gemini Vision & OCR Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
gemini.mock.fallback=true
